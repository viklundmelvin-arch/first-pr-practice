<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grish & Old Money</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e6;--ink:#0f2340;--muted:#6b6457}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Playfair Display',Georgia,serif}
header{text-align:center;padding:48px 16px 8px}
h1{font-size:clamp(32px,6vw,56px);letter-spacing:.08em;margin:0}
header p{color:var(--muted);font-style:italic;margin:.4em 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px;max-width:1100px;margin:32px auto;padding:0 16px}
figure{margin:0;text-align:center}
.shirt{position:relative;width:100%;aspect-ratio:1}
.shirt svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.12))}
.shirt img{position:absolute;left:31%;top:27%;width:38%}
figcaption{margin-top:6px;font-size:18px}
figcaption small{display:block;color:var(--muted);font-size:13px;font-style:italic}
</style></head><body>
<header><h1>GRISH &amp; OLD MONEY</h1><p>Sex tröjor. Noll logotyper. Allt arv.</p></header>
<main class="grid" id="g"></main>
<script>
const designs=[
 ["01-crest.svg","#f3ead7","The Crest","Navy on cream"],
 ["02-country-club.svg","#ffffff","Östermalm Country Club","Racing green on white"],
 ["03-never-dies.svg","#0f2340","Old Money Never Dies","Cream & gold on navy"],
 ["04-yacht-club.svg","#f3ead7","Grish Yacht Club","Navy & red on cream"],
 ["05-monogram.svg","#1a1a1a","G&M Monogram","Gold on black"],
 ["06-inte-nyrik.svg","#dfe8f1","Inte nyrik. Bara grish.","Navy on light blue"]];
const shirt=c=>`<svg viewBox="0 0 400 400"><path fill="${c}" stroke="rgba(0,0,0,.15)" stroke-width="2" d="M140 40 Q200 75 260 40 L345 75 L385 150 L330 175 L310 145 L310 370 Q200 380 90 370 L90 145 L70 175 L15 150 L55 75 Z"/><path d="M140 40 Q200 75 260 40" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="5"/></svg>`;
document.getElementById('g').innerHTML=designs.map(([f,c,t,s])=>`<figure><div class="shirt">${shirt(c)}<img src="${f}" alt="${t}"></div><figcaption>${t}<small>${s}</small></figcaption></figure>`).join('');
</script></body></html>
