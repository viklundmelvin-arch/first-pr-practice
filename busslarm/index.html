<title>Busslarm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column like a departure board. Big wake time, then the day drawn as a line map, rules instead of cards, tab bar at the bottom. */
:root {
  --desk: #0b0a09;
  --bg: #12110f;
  --panel: #1a1916;
  --raise: #23211d;
  --ink: #ede6d8;
  --muted: #9b9384;
  --faint: #5f594f;
  --line: #2e2b26;
  --amber: #f2a93b;
  --amber-ink: #1a1206;
  --amber-soft: #3a2a12;
  --ok: #93b77a;
  --bad: #e0705a;
  --scrim: rgba(0, 0, 0, .6);
  --map-bg: #171613;
  --map-street: #26241f;
  --map-green: #1b2119;
  --l670x: #e2604c;
  --l670: #d98aa6;
  --l3: #5aa2e6;
  --l7: #4fb8a0;
  --alarm-bg: #070605;
  --alarm-ink: #ede6d8;
  --alarm-amber: #f2a93b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
:root[data-app-theme="light"] {
  --desk: #dcd7cc; --bg: #eeebe4; --panel: #f7f5f0; --raise: #e5e1d8; --ink: #1d1b17; --muted: #6b6458; --faint: #a39b8c;
  --line: #d4cec2; --amber: #a86304; --amber-ink: #fff8ec; --amber-soft: #f1dfbf; --ok: #4c7a32; --bad: #b5412b;
  --scrim: rgba(30, 25, 15, .35); --map-bg: #e7e3d9; --map-street: #f8f6f1; --map-green: #dde3d2;
  --l670x: #c23b28; --l670: #a8466f; --l3: #2f6fb5; --l7: #23806b;
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root[data-app-theme="system"] {
    --desk: #dcd7cc; --bg: #eeebe4; --panel: #f7f5f0; --raise: #e5e1d8; --ink: #1d1b17; --muted: #6b6458; --faint: #a39b8c;
    --line: #d4cec2; --amber: #a86304; --amber-ink: #fff8ec; --amber-soft: #f1dfbf; --ok: #4c7a32; --bad: #b5412b;
    --scrim: rgba(30, 25, 15, .35); --map-bg: #e7e3d9; --map-street: #f8f6f1; --map-green: #dde3d2;
    --l670x: #c23b28; --l670: #a8466f; --l3: #2f6fb5; --l7: #23806b;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 460px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
@media (min-width: 640px) {
  html, body { background: var(--desk); }
  body { padding-block: 28px; }
  .app { background: var(--bg); border: 1px solid var(--line); border-radius: 24px; padding-inline: 22px; min-height: calc(100vh - 56px); }
}

.top { display: flex; align-items: center; gap: 12px; padding-block: 14px 8px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: .16em; text-transform: uppercase; }
.clock { margin-left: auto; font-family: var(--display); font-weight: 500; font-size: 1.1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.iconbtn { background: none; border: 0; color: var(--muted); padding: 8px; margin-right: -8px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; }
.top { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.extag { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .75rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.extag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }

main { flex: 1; padding-block: 18px 32px; min-width: 0; }
.view { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.block { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); min-width: 0; }
.label, h2 { font-family: var(--display); font-weight: 600; font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.note { font-size: .85rem; color: var(--muted); }
.warn { color: var(--bad); }
.okc { color: var(--ok); }

.btn { font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); padding: 10px 16px; min-height: 44px; cursor: pointer; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.btn.ghost { background: none; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--amber); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; background: none; border: 0; border-left: 1px solid var(--line); padding: 9px 4px; color: var(--muted); font-weight: 600; font-size: .9rem; cursor: pointer; min-height: 40px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--amber-soft); color: var(--ink); }

.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); min-width: 0; }
.field input, .field select, .inp { font: inherit; font-size: 1rem; color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: center; font-size: .95rem; }
.check input { width: 20px; height: 20px; accent-color: var(--amber); }

/* Today */
.dayhead { display: flex; align-items: center; gap: 6px; }
.dayhead .label { flex: 1; }
.wake { font-family: var(--display); font-weight: 600; font-size: clamp(5.6rem, 31vw, 8.6rem); line-height: .82; color: var(--amber); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.wake.none { color: var(--faint); }
.wake-sub { font-size: 1.05rem; }
.gain { font-size: .95rem; color: var(--muted); }
.gain b { color: var(--ink); font-weight: 600; }
.armed { font-size: .9rem; color: var(--ok); }

.lm { list-style: none; margin: 0; padding: 0; }
.lm li { display: grid; grid-template-columns: 3.7rem 22px minmax(0, 1fr); column-gap: 10px; min-height: 46px; }
.lm .t { font-family: var(--display); font-weight: 600; font-size: 1.3rem; line-height: 1.15; text-align: right; font-variant-numeric: tabular-nums; }
.lm .t small { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.lm .rail { position: relative; }
.lm .rail::before { content: ""; position: absolute; left: 50%; top: 10px; bottom: -10px; width: 4px; transform: translateX(-50%); background: var(--segc, var(--line)); }
.lm li:last-child .rail::before { display: none; }
.lm .dot { position: absolute; left: 50%; top: 5px; width: 13px; height: 13px; transform: translateX(-50%); border-radius: 50%; background: var(--bg); border: 3px solid var(--nodec, var(--ink)); z-index: 1; }
.lm .body { padding-bottom: 14px; min-width: 0; }
.lm .what { font-weight: 600; }
.lm .lmb { display: flex; flex-direction: column; gap: 2px; width: 100%; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.lm .has .what::after { content: "+"; margin-left: 8px; color: var(--faint); font-weight: 500; }
.lm .has.open .what::after { content: "–"; }
.lm .det { display: none; color: var(--muted); font-size: .88rem; }
.lm li.open .det { display: block; }
.trip { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 1.02rem; }
.trip .sep { color: var(--faint); }
.riskline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .95rem; }
.riskline .risk { font-size: 1.1rem; }
.dayrow { display: grid; grid-template-columns: 5.2rem 3.6rem minmax(0, 1fr); gap: 10px; align-items: baseline; width: 100%; background: none; border: 0; padding: 12px 0; text-align: left; cursor: pointer; border-top: 1px solid var(--line); }
.dayrow:first-child { border-top: 0; }
.dayrow .dn { font-family: var(--display); font-weight: 600; font-size: 1.15rem; }
.dayrow .w { font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--amber); font-variant-numeric: tabular-nums; }
.dayrow .w.none { color: var(--faint); }
.dayrow .e { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dayopen { display: flex; flex-direction: column; gap: 4px; padding: 0 0 14px 5.2rem; }
@media (max-width: 360px) { .dayopen { padding-left: 0; } }
.lm .s-routine { --segc: var(--amber); }
.lm .s-routine .rail::before { width: 2px; }
.lm .s-walk .rail::before { width: 3px; background: repeating-linear-gradient(to bottom, var(--muted) 0 3px, transparent 3px 8px); }
.lm .s-bus .rail::before { width: 7px; background: var(--lc); }
.lm .s-event .rail::before { width: 2px; background: var(--line); }
.lm .n-wake .t { color: var(--amber); }
.lm .n-wake .dot { --nodec: var(--amber); }
.lm .n-event .dot { border-radius: 3px; background: var(--ink); --nodec: var(--ink); }
.lm .n-bad .t, .lm .n-bad .what { color: var(--bad); }
.lm .n-bad .dot { --nodec: var(--bad); }

.chip { display: inline-block; font-family: var(--display); font-weight: 700; font-size: .85rem; line-height: 1.35; padding: 0 6px; border-radius: 4px; background: var(--lc); color: var(--bg); vertical-align: 1px; }
.c-670X { --lc: var(--l670x); } .c-670 { --lc: var(--l670); } .c-3 { --lc: var(--l3); } .c-7 { --lc: var(--l7); }

.riskhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.risk { font-family: var(--display); font-weight: 600; font-size: 1.35rem; }
.risk.low { color: var(--ok); } .risk.mid { color: var(--amber); } .risk.high { color: var(--bad); } .risk.unk { color: var(--muted); }
.ticks { display: flex; gap: 3px; align-items: flex-end; flex-wrap: wrap; }
.tick { width: 10px; height: 28px; border-radius: 2px; background: var(--ok); position: relative; }
.tick.fail { background: var(--bad); }
.tick.mon::after { content: ""; position: absolute; left: 3px; bottom: -7px; width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
.ticks.mini .tick { width: 4px; height: 16px; border-radius: 1px; }
.ticks.mini .tick.mon::after { display: none; }

.chart-wrap { overflow-x: auto; }
.chart { display: block; width: 100%; min-width: 360px; }
.chart text { fill: var(--muted); font-family: var(--display); font-size: 12px; }
.chart .grid { stroke: var(--line); }
.chart .tt { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart .you { stroke: var(--amber); }
.chart .pt { fill: var(--ink); }
.chart .pt.mon { fill: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--c); }

.morning { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--amber); border-radius: 14px; }
.morning .say { font-family: var(--display); font-weight: 600; font-size: 2rem; line-height: 1.05; }
.morning .simclock { font-family: var(--display); font-size: 1.1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tracker { display: flex; flex-direction: column; gap: 6px; }
.track { position: relative; height: 22px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; background: var(--lc); border-radius: 2px; }
.track i { position: absolute; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--lc); transform: translateX(-50%); }
.track i.here { width: 14px; height: 14px; top: 4px; border-color: var(--ink); border-width: 3px; }
.track b { position: absolute; top: 0; width: 22px; height: 22px; border-radius: 6px; background: var(--ink); transform: translateX(-50%); transition: left .9s linear; }
.track b::after { content: ""; position: absolute; inset: 6px 5px; border-radius: 2px; background: var(--bg); }
.log { list-style: none; margin: 0; padding: 0; font-size: .85rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

/* Options */
.opts { display: flex; flex-direction: column; }
.opt { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; padding: 14px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; cursor: pointer; }
.opt:first-child { border-top: 0; }
.opt .big { font-family: var(--display); font-weight: 600; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.opt .big small { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.opt.rec .big { color: var(--amber); }
.opt .mid { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.opt .legs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: .95rem; }
.opt .sub { font-size: .85rem; color: var(--muted); }
.opt .side { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: .8rem; color: var(--muted); }
.opt .side .risk { font-size: 1rem; }
.opt .tag {font-family: var(--display); font-weight: 600; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.opt.sel { box-shadow: inset 3px 0 0 var(--amber); padding-left: 10px; }
.opt.no .big { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 2px; }
.opt.no { cursor: default; }
.optdetail { padding: 4px 0 16px; display: flex; flex-direction: column; gap: 12px; }

/* Week */
.day { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.day:first-child { border-top: 0; padding-top: 0; }
.day h3 { font-family: var(--display); font-weight: 600; font-size: 1.25rem; }
.day h3 span { color: var(--muted); font-weight: 500; }
.ev { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 10px; background: none; border: 0; padding: 4px 0; text-align: left; cursor: pointer; width: 100%; }
.ev .t { font-family: var(--display); font-weight: 600; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.ev .sub { font-size: .85rem; color: var(--muted); }
.daysum { font-size: .9rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.daysum .w { font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--amber); }

/* Map */
.map { display: block; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border: 1px solid var(--line); border-radius: 12px; background: var(--map-bg); }
.map.editing { cursor: crosshair; border-color: var(--amber); }
.map .street { stroke: var(--map-street); fill: none; }
.map .park { fill: var(--map-green); }
.map .route { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.map .walk { fill: none; stroke: var(--muted); stroke-dasharray: 2 5; stroke-linecap: round; }
.map .walk.hl { stroke: var(--amber); }
.map .stop { fill: var(--bg); stroke: var(--ink); }
.map .stop.hl { stroke: var(--amber); }
.map text { font-family: var(--body); }
.map .lbl { fill: var(--ink); font-weight: 600; paint-order: stroke; stroke: var(--map-bg); stroke-linejoin: round; }
.map .sub { fill: var(--muted); paint-order: stroke; stroke: var(--map-bg); stroke-linejoin: round; }
.map .place { fill: var(--ink); }
.map .home { fill: var(--amber); }
.map .scale { stroke: var(--muted); }
.places { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.places li { display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-top: 1px solid var(--line); }
.places li:first-child { border-top: 0; }
.places .name { font-weight: 600; display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.places .sub { font-size: .85rem; color: var(--muted); }

/* Tabs */
.tabs { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg); border-top: 1px solid var(--line); margin-inline: -16px; padding: 4px 16px calc(4px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 640px) { .tabs { margin-inline: -22px; padding-inline: 22px; border-radius: 0 0 24px 24px; } }
.tab { background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; font-weight: 600; letter-spacing: .02em; padding: 7px 0; cursor: pointer; }
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--amber); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--scrim); }
.sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; max-height: 90%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h2 { font-size: 1rem; color: var(--ink); }
.steps { display: flex; flex-direction: column; gap: 6px; }
.step { display: grid; grid-template-columns: minmax(0, 1fr) 4.6rem 36px; gap: 6px; align-items: center; }
.step .x { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px; font-size: 1.1rem; }
.prose { font-size: .92rem; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.prose b { color: var(--ink); font-weight: 600; }

/* Alarm screen: always dark, it is 6 in the morning */
.alarm { position: fixed; inset: 0; z-index: 40; background: var(--alarm-bg); color: var(--alarm-ink); display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); }
.alarm .inner { width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.alarm .now { font-family: var(--display); font-weight: 600; font-size: clamp(6rem, 36vw, 10rem); line-height: .8; color: var(--alarm-amber); font-variant-numeric: tabular-nums; }
.alarm .what { font-size: 1.15rem; }
.alarm .what span { color: var(--alarm-amber); font-weight: 600; }
.alarm .btns { display: flex; flex-direction: column; gap: 10px; }
.alarm .btn { min-height: 60px; font-size: 1.15rem; background: #1d1b18; border-color: #34302a; color: var(--alarm-ink); }
.alarm .btn.primary { background: var(--alarm-amber); border-color: var(--alarm-amber); color: #1a1206; }
.alarm .hint { font-size: .9rem; color: #9b9384; }
@media (prefers-reduced-motion: reduce) { .track b { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <span class="brand">Busslarm</span>
    <button class="extag" type="button" data-act="about">Exempeldata</button>
    <span class="clock" id="clock">--:--</span>
    <button class="iconbtn" id="openSettings" type="button" aria-label="Inställningar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
    </button>
  </header>
  <main>
    <section class="view" id="view-idag"></section>
    <section class="view" id="view-vecka" hidden></section>
    <section class="view" id="view-resa" hidden></section>
    <section class="view" id="view-platser" hidden></section>
  </main>
  <nav class="tabs" aria-label="Huvudmeny">

<script>
"use strict";
// ---------- Time helpers ----------
const DAY = 86400;
const pc = s => { const [h, m, sec = 0] = String(s).split(":").map(Number); return h * 3600 + m * 60 + sec; };
function fmt(sec, withSeconds = false) {
  sec = ((Math.round(sec) % DAY) + DAY) % DAY;
  const h = String(Math.floor(sec / 3600)).padStart(2, "0");

}

const DOW = ["sön", "mån", "tis", "ons", "tor", "fre", "lör"];
const DOWL = ["söndag", "måndag", "tisdag", "onsdag", "torsdag", "fredag", "lördag"];
const MON = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dateOf = s => new Date(s + "T12:00:00");
const addDays = (s, n) => { const d = dateOf(s); d.setDate(d.getDate() + n); return iso(d); };
const todayIso = () => iso(new Date());
const nowSec = () => { const d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(); };
const dayType = s => [0, 6].includes(dateOf(s).getDay()) ? "helg" : "vardag";
function dayName(s) {
  const t = todayIso();
  const d = dateOf(s);
  const base = `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
  if (s === t) return `Idag · ${base}`;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- Network (phase A) ----------
// Stops in metres on a local grid, north up. Pålsundsvägen is real; the rest is an example network.
const STOPS = {
  pal: { name: "Pålsundsvägen", x: 0, y: 0 },
  ekb: { name: "Ekbacken", x: -200, y: 950 },
  sta: { name: "Stationen", x: 19000, y: 200 },
  sko: { name: "Skolvägen", x: 20600, y: 900 },
  cen: { name: "Centrum", x: 20200, y: -300 },
  par: { name: "Parkgatan", x: 21200, y: -900 },
};
const LINES = {
  "670X": { kind: "regional" }, "670": { kind: "regional" }, "3": { kind: "city" }, "7": { kind: "city" },
};
// Assumed lateness when a trip has no history, per safety level (s).
const UNKNOWN_LATE = { regional: { vanlig: 120, saker: 300, mycket: 480 }, city: { vanlig: 60, saker: 180, mycket: 300 } };
const SAFETY = {
  vanlig: { name: "Vanlig", q: 0.5, text: "Räknar med en vanlig morgon (medianen). Mest sömn, men var tredje morgon kan bli tight." },
  saker: { name: "Säker", q: 0.9, text: "Räknar med en sen morgon: 9 av 10 morgnar gick bussen tidigare än så." },
  mycket: { name: "Mycket säker", q: 1, text: "Räknar med den sämsta morgonen som finns i historiken." },

const STOP_SLACK = 30;       // stand at the stop this long before the earliest departure ever seen
const NO_DATA_EARLY = 60;    // without history, be there a minute before the timetable
const MIN_TRANSFER = 60;     // seconds between getting off and the next bus leaving
const DETOUR = 1.25;         // walking distance = straight line × 1.25

const REAL_670X = ["06:20", "06:36", "06:50", "07:05", "07:21:15", "07:37", "07:50"].map(pc);
const TRIPS = [];
function addTrips(line, dir, stops, offsetsMin, deps, days, isReal = () => false) {
  for (const d of deps) TRIPS.push({ id: `${line}-${dir}-${fmt(d, true)}`, line, dir, stops, times: offsetsMin.map(o => d + Math.round(o * 60)), days, real: isReal(d) });
}
addTrips("670X", "in", ["pal", "sta", "sko", "cen"], [0, 28, 33, 36],
  [...REAL_670X, ...range(pc("08:05"), pc("08:50"), 900), ...range(pc("09:20"), pc("15:50"), 1800), ...range(pc("16:05"), pc("18:50"), 900)],
  "vardag", d => REAL_670X.includes(d));
addTrips("670", "in", ["ekb", "pal", "sta", "sko", "cen"], [0, 3, 34, 41, 44], range(pc("05:37"), pc("22:07"), 1800), "alla");
addTrips("3", "ut", ["sta", "cen", "sko"], [0, 5, 9], range(pc("06:01"), pc("21:51"), 600), "alla");
addTrips("3", "in", ["sko", "cen", "sta"], [0, 4, 9], range(pc("06:03"), pc("21:53"), 600), "alla");
addTrips("7", "ut", ["sta", "cen", "par"], [0, 4, 10], range(pc("06:08"), pc("21:53"), 900), "alla");
addTrips("7", "in", ["par", "cen", "sta"], [0, 6, 10], range(pc("06:02"), pc("21:47"), 900), "alla");
const TRIP_BY_ID = Object.fromEntries(TRIPS.map(t => [t.id, t]));
const BY_STOP = {};
for (const t of TRIPS) t.stops.forEach((s, i) => (BY_STOP[s] ||= []).push({ t, i }));
for (const s in BY_STOP) BY_STOP[s].sort((a, b) => a.t.times[a.i] - b.t.times[b.i]);
const LINES_AT = {};
for (const t of TRIPS) for (const s of t.stops) (LINES_AT[s] ||= new Set()).add(t.line);

// Observed departures of 670X 07:21:15 at Pålsundsvägen, seconds after the timetable (KoDa, weekdays).
const HIST_RAW = {
  "670X-in-07:21:15": [
    ["2026-09-29", 189], ["2026-09-30", 232], ["2026-10-01", 188], ["2026-10-02", 170],
    ["2026-10-05", 420], ["2026-10-06", 95], ["2026-10-07", 209], ["2026-10-08", 93], ["2026-10-09", 223],
    ["2026-10-12", 895], ["2026-10-13", 181], ["2026-10-14", 345], ["2026-10-15", 191], ["2026-10-16", 156],
    ["2026-10-19", 187], ["2026-10-20", 270], ["2026-10-21", 193], ["2026-10-22", 229], ["2026-10-23", 148],
  ],
};
const quantile = (sorted, q) => sorted[Math.min(sorted.length - 1, Math.max(0, Math.ceil(q * sorted.length) - 1))];
const HIST = {};
for (const [id, rows] of Object.entries(HIST_RAW)) {
  const sorted = rows.map(r => r[1]).sort((a, b) => a - b);
  HIST[id] = { rows, sorted, min: sorted[0], q: q => quantile(sorted, q), median: quantile(sorted, 0.5) };
}

// ---------- State ----------
const KEY = "busslarm.v2";
function seed() {
  const t = todayIso();
  const d1 = addDays(t, 1), d2 = addDays(t, 2), d3 = addDays(t, 3);
  let sat = null;
  for (let i = 1; i <= 6; i++) if (dateOf(addDays(t, i)).getDay() === 6) sat = addDays(t, i);
  const events = [
    { id: "e1", title: "Prov i matte", place: "skolan", date: d1, start: pc("08:30"), end: pc("10:00"), early: 15, routine: "vanlig", repeat: false, example: true },
    { id: "e2", title: "Möte med handledare", place: "jobbet", date: d1, start: pc("11:15"), end: pc("12:00"), early: 5, routine: "vanlig", repeat: false, example: true },
    { id: "e3", title: "Jobb", place: "jobbet", date: d2, start: pc("09:00"), end: pc("16:00"), early: 5, routine: "vanlig", repeat: true, example: true },
    { id: "e4", title: "Föreläsning", place: "skolan", date: d3, start: pc("10:15"), end: pc("12:00"), early: 10, routine: "snabb", repeat: false, example: true },
  ];
  if (sat) events.push({ id: "e5", title: "Träning", place: "gymmet", date: sat, start: pc("10:00"), end: pc("11:30"), early: 0, routine: "snabb", repeat: false, example: true });
  return {
    settings: {
      speed: "normal", customKmh: 5, safety: "saker", snooze: 5, theme: "dark",
      routines: {
        vanlig: [["Dusch", 12], ["Klä på dig", 8], ["Frukost", 15], ["Tänder och packning", 10]],
        snabb: [["Klä på dig", 6], ["Snabb frukost", 8], ["Tänder och packning", 6]],
      },
    },
    home: { mode: "point", x: -264, y: 352, stop: "pal", meters: 550 },
    places: [
      { id: "skolan", name: "Skolan", x: 20800, y: 1050, note: "" },
      { id: "jobbet", name: "Jobbet", x: 21300, y: -1100, note: "" },
      { id: "biblioteket", name: "Biblioteket", x: 20300, y: -150, note: "" },
      { id: "gymmet", name: "Gymmet", x: 19150, y: 450, note: "" },
    ],
    events,
  };
}
function loadState() { try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch { return null; } }
function saveState() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
let S = loadState() || seed();
const ui = {
  tab: "idag", viewDate: null, disturb: "none", expanded: null, armed: null, sim: null, alarm: null,
  resa: { from: "hem", to: "skolan", date: null, time: "08:15", open: null }, mapArea: "hem", mapEdit: null, sheet: null,
};

// ---------- Geometry and walking ----------
const kmh = () => ({ lugn: 4.5, normal: 5.5, snabb: 6.5 }[S.settings.speed] ?? Math.min(15, Math.max(2, Number(S.settings.customKmh) || 5)));
const speedMs = () => kmh() / 3.6;
const walkM = (a, b) => Math.round(Math.hypot(a.x - b.x, a.y - b.y) * DETOUR / 10) * 10;
const walkS = m => Math.round(m / speedMs());
const areaOf = p => (p.x > 10000 ? "stan" : "hem");
function place(id) {
  if (id === "hem") return { id: "hem", name: "Hem", x: S.home.x, y: S.home.y };
  return S.places.find(p => p.id === id) || null;
}
function originOf(id) {
  if (id === "hem" && S.home.mode === "stop") return { id, stopOnly: S.home.stop, meters: Number(S.home.meters) || 0 };
  const p = place(id);
  return p ? { id, x: p.x, y: p.y } : null;
}
function nearStops(o, limit = 1500) {
  if (o.stopOnly) return [{ stop: o.stopOnly, m: o.meters }];
  return Object.keys(STOPS).map(s => ({ stop: s, m: walkM(o, STOPS[s]) })).filter(r => r.m <= limit).sort((a, b) => a.m - b.m);
}
const NEAR = {};
for (const a in STOPS) NEAR[a] = Object.keys(STOPS).map(b => [b, a === b ? 0 : walkM(STOPS[a], STOPS[b])]).filter(([, m]) => m <= 600);

// ---------- Journey planner ----------
const active = (t, dt) => t.days === "alla" || (t.days === "vardag" && dt === "vardag");
function lateFor(leg, safety) {
  if (leg.hist) return leg.hist.q(SAFETY[safety].q);
  return UNKNOWN_LATE[LINES[leg.trip.line].kind][safety];
}

// Search backwards from the arrival target: every way to get there with at most one change,
// then keep the ones whose late case still makes it, ranked by how late you can leave.
function planTrip({ from, to, target, earliest = null, date, safety = S.settings.safety, exclude = null, probe = false }) {
  const o = originOf(from), d = originOf(to);
  if (!o || !d) return { options: [], tooLate: null, earliestArrival: null };
  const dt = dayType(date);
  const oMap = new Map(nearStops(o).map(r => [r.stop, r.m]));
  const dMap = new Map((d.stopOnly ? [{ stop: d.stopOnly, m: d.meters }] : nearStops(d)).map(r => [r.stop, r.m]));
  const lo = (earliest ?? target - 4 * 3600) - 30 * 60;
  const cands = [];
  for (const A of TRIPS) {
    if (!active(A, dt) || exclude?.has(A.id)) continue;
    for (let i = 0; i < A.stops.length - 1; i++) {
      const wo = oMap.get(A.stops[i]);
      if (wo == null) continue;
      const dep = A.times[i];
      if (dep > target || dep < lo) continue;
      for (let j = i + 1; j < A.stops.length; j++) {
        const s = A.stops[j];
        const leg1 = { trip: A, i, j };
        const wd = dMap.get(s);
        if (wd != null) cands.push({ legs: [leg1], wo, wd, tr: [] });
        for (const [y, tm] of NEAR[s]) {
          const seen = new Map();
          for (const { t: B, i: k } of BY_STOP[y]) {
            const bd = B.times[k];
            if (bd > target) break;
            if (B.line === A.line || !active(B, dt) || exclude?.has(B.id)) continue;
            if (bd < A.times[j] + walkS(tm) + MIN_TRANSFER) continue;
            const key = B.line + B.dir, c = seen.get(key) || 0;
            if (c >= 2) continue;
            seen.set(key, c + 1);
            for (let l = k + 1; l < B.stops.length; l++) {
              const wd2 = dMap.get(B.stops[l]);
              if (wd2 != null) cands.push({ legs: [leg1, { trip: B, i: k, j: l }], wo, wd: wd2, tr: [tm] });
            }
          }
        }
      }
    }
  }
  const evald = cands.map(c => evaluate(c, { target, earliest, dt, safety }));
  if (!o.stopOnly && !d.stopOnly) {
    const m = walkM(o, d);
    if (m <= 3000) {
      const leave = target - walkS(m);
      evald.push({ key: "walk", walkOnly: true, walkM: m, legs: [], leave, final: target, typical: target, ok: earliest == null || leave >= earliest, fail: earliest != null && leave < earliest ? "tidigt" : null, transfers: 0, totalWalk: m, risk: "walk" });
    }
  }
  const rank = (a, b) => b.leave - a.leave || a.transfers - b.transfers || a.totalWalk - b.totalWalk || a.final - b.final;
  const best = new Map();
  for (const e of evald.filter(e => e.ok).sort(rank)) if (!best.has(e.key)) best.set(e.key, e);
  const options = [...best.values()].slice(0, 4);
  const topLeave = options[0]?.leave ?? -Infinity;
  const tooLate = evald.filter(e => !e.ok && e.fail !== "tidigt" && e.leave > topLeave && !best.has(e.key))
    .sort((a, b) => a.leave - b.leave || a.transfers - b.transfers)[0] || null;
  let earliestArrival = null;
  if (!options.length && earliest != null && !probe) {
    const later = planTrip({ from, to, target: earliest + 4 * 3600, earliest, date, safety, exclude, probe: true });
    earliestArrival = later.options.length ? Math.min(...later.options.map(x => x.final)) : null;
  }
  return { options, tooLate, earliestArrival, target };
}

function evaluate(c, { target, earliest, dt, safety }) {
  const legs = c.legs.map(({ trip, i, j }) => ({
    trip, line: trip.line, from: trip.stops[i], to: trip.stops[j], dep: trip.times[i], arr: trip.times[j],
    hist: dt === "vardag" && i === 0 ? HIST[trip.id] || null : null,
  }));
  const L0 = legs[0], last = legs[legs.length - 1];
  const atStop = L0.hist ? Math.floor((L0.dep + L0.hist.min - STOP_SLACK) / 60) * 60 : L0.dep - NO_DATA_EARLY;
  const leave = atStop - walkS(c.wo);
  // Check a run where each bus is as late as the safety level allows.
  const run = delays => {
    for (let k = 0; k < legs.length - 1; k++) {
      if (legs[k].arr + delays[k] + walkS(c.tr[k]) + MIN_TRANSFER > legs[k + 1].dep) return { ok: false, why: "byte", at: k };
    }
    const final = last.arr + delays[legs.length - 1] + walkS(c.wd);
    return { ok: final <= target, why: final <= target ? null : "sent", final };
  };
  const plan = run(legs.map(l => lateFor(l, safety)));
  const typ = run(legs.map(l => (l.hist ? l.hist.median : 0)));
  let ok = plan.ok, fail = plan.why;
  if (earliest != null && leave < earliest) { ok = false; fail = "tidigt"; }
  let stats = null;
  const h = legs.find(l => l.hist)?.hist;
  if (h) {
    const days = h.rows.map(([date], idx) => {
      const r = run(legs.map(l => (l.hist ? l.hist.rows[idx][1] : 0)));
      return { date, ok: r.ok, dep: L0.dep + (L0.hist ? L0.hist.rows[idx][1] : 0) };
    });
    stats = { days, ok: days.filter(x => x.ok).length, n: days.length };
  }
  const ratio = stats ? stats.ok / stats.n : null;
  const risk = stats ? (ratio >= 0.95 ? "low" : ratio >= 0.8 ? "mid" : "high") : "unk";
  const totalWalk = c.wo + c.wd + c.tr.reduce((a, b) => a + b, 0);
  return {
    key: `${L0.trip.id}@${L0.from}`, legs, wo: c.wo, wd: c.wd, tr: c.tr, atStop, leave,
    final: plan.final ?? (last.arr + lateFor(last, safety) + walkS(c.wd)), typical: typ.final ?? last.arr + walkS(c.wd),
    timetable: last.arr + walkS(c.wd), ok, fail, stats, risk, transfers: legs.length - 1, totalWalk,
    wait: (L0.hist ? L0.dep + L0.hist.median : L0.dep) - atStop,
  };
}

// ---------- Day plans ----------
function eventsOn(date) {
  const dow = dateOf(date).getDay();
  return S.events.filter(e => e.date === date || (e.repeat && date >= e.date && dateOf(e.date).getDay() === dow)).sort((a, b) => a.start - b.start);
}
const routineSec = name => (S.settings.routines[name] || []).reduce((s, [, m]) => s + (Number(m) || 0) * 60, 0);
function dayPlan(date, exclude = null) {
  const events = eventsOn(date);
  const segs = [];
  let from = "hem", earliest = null;
  for (const ev of events) {
    const target = ev.start - ev.early * 60;
    if (ev.place === from) {
      segs.push({ ev, from, same: true, target });
    } else {
      const res = planTrip({ from, to: ev.place, target, earliest, date, exclude });
      const chosen = res.options.find(o => o.key === ev.choice) || res.options[0] || null;
      segs.push({ ev, from, res, chosen, target, gap: earliest != null && chosen ? chosen.leave - earliest : null });
    }
    from = ev.place; earliest = ev.end;
  }
  let wake = null, routine = 0;
  if (segs.length) {
    const s0 = segs[0];
    routine = routineSec(s0.ev.routine);
    const leave0 = s0.same ? s0.target : s0.chosen?.leave;
    if (leave0 != null) wake = leave0 - routine;
  }
  return { date, events, segs, wake, routine };
}
function defaultViewDate() {
  const t = todayIso();
  const p = dayPlan(t);
  if (p.wake != null && nowSec() < p.segs[0].ev.start) return t;
  for (let i = 1; i < 7; i++) if (eventsOn(addDays(t, i)).length) return addDays(t, i);
  return addDays(t, 1);
}

// ---------- Rendering helpers ----------
const chip = line => `<span class="chip c-${esc(line)}">${esc(line)}</span>`;
const stopName = s => STOPS[s]?.name || s;
const placeName = id => place(id)?.name || "Okänd plats";
const riskText = { low: "Låg risk", mid: "Medelrisk", high: "Hög risk", unk: "Okänd risk", walk: "Bara gång" };
function ticks(stats, mini = false) {
  if (!stats) return "";
  return `<div class="ticks${mini ? " mini" : ""}" aria-hidden="true">${stats.days.map(d => {
    const mon = dateOf(d.date).getDay() === 1;
    return `<span class="tick${d.ok ? "" : " fail"}${mon ? " mon" : ""}" title="${esc(d.date)}: bussen gick ${fmt(d.dep, true)}${d.ok ? "" : ", hade missat"}"></span>`;
  }).join("")}</div>`;
}
function riskLine(o) {
  if (o.walkOnly) return "Ingen buss, ingen förseningsrisk.";
  if (o.stats) return `Hade fungerat <b>${o.stats.ok} av ${o.stats.n}</b> vardagsmorgnar (29 sep–23 okt).${o.legs.length > 1 ? " Bussen efter bytet antas gå enligt tidtabell." : ""}`;
  return `Ingen historik för de här avgångarna. Appen räknar med att ${o.legs.length > 1 ? "varje buss" : "bussen"} kan vara ${durMin(lateFor(o.legs[o.legs.length - 1], S.settings.safety))} sen.`;
}

function riskShort(o) {
  if (o.walkOnly) return `<span class="risk low">Gång</span>`;
  if (o.stats) return `<span class="risk ${o.risk}">${o.stats.ok}/${o.stats.n}</span>`;
  return `<span class="risk unk">Okänd</span>`;
}
function optRow(o, { rec = false, sel = false, wakeFrom = null } = {}) {
  const legs = o.walkOnly ? `<span>Gå hela vägen</span>`
    : o.legs.map((l, k) => `${k ? '<span aria-hidden="true">→</span>' : ""}${chip(l.line)} <span>${fmt(l.dep)}</span>`).join(" ");

    <span class="big">${big}</span>

  </button>`;
}
function tooLateRow(o, wakeFrom = null) {

// Line-map rows for one day: only the stops that matter, details open on tap.
function lmRows(p, { live = null } = {}) {
  const rows = [];
  const row = (t, what, det, seg = "", node = "", style = "", tSmall = "") => {
    const body = det
      ? `<button class="lmb" type="button" data-act="lmtoggle" aria-expanded="false"><span class="what">${what}</span><span class="det">${det}</span></button>`
      : `<span class="what">${what}</span>`;
    rows.push(`<li class="${seg} ${node}${det ? " has" : ""}" style="${style}"><span class="t">${t}${tSmall ? `<small>${tSmall}</small>` : ""}</span><span class="rail"><span class="dot"></span></span><span class="body">${body}</span></li>`);
  };
  p.segs.forEach((s, idx) => {
    if (idx === 0 && p.wake != null) {
      const r = S.settings.routines[s.ev.routine] || [];
      row(fmt(p.wake), "Vakna", `${s.ev.routine === "snabb" ? "Snabb" : "Vanlig"} rutin, ${durMin(p.routine)}: ${r.map(x => esc(x[0])).join(", ")}`, "s-routine", "n-wake");
    }
    if (s.same) {
      row(fmt(s.ev.start), esc(s.ev.title), `${esc(placeName(s.ev.place))} · till ${fmt(s.ev.end)}`, "s-event", "n-event");
      return;
    }
    const o = s.chosen;
    if (!o) {
      const ea = s.res.earliestArrival;
      row(fmt(s.target), "Går inte ihop", ea != null ? `Tidigaste ankomst ${fmt(ea)}, ${durMin(ea - s.target)} för sent.` : "Ingen resa hittades den dagen.", "s-event", "n-bad");
      row(fmt(s.ev.start), esc(s.ev.title), `${esc(placeName(s.ev.place))} · till ${fmt(s.ev.end)}`, "s-event", "n-event");
      return;
    }
    const fromName = s.from === "hem" ? "Gå hemifrån" : `Gå från ${esc(placeName(s.from))}`;
    const gap = s.gap != null && s.gap > 120 ? `${durMin(s.gap)} ledigt innan. ` : "";
    if (o.walkOnly) {
      row(fmt(o.leave), fromName, `${gap}Gå hela vägen, ${o.walkM} m · ${dur(walkS(o.walkM))}`, "s-walk");
    } else {
      const lv = live && idx === 0 ? live.leave : o.leave;
      row(fmt(lv), fromName, `${gap}${o.wo} m till ${esc(stopName(o.legs[0].from))} · ${dur(walkS(o.wo))}`, "s-walk");
      o.legs.forEach((l, k) => {
        const lc = `--lc: var(--l${l.line.toLowerCase()})`;
        if (k === 0) {
          const usual = l.hist ? `Bussen brukar gå ${fmt(l.dep + l.hist.median)}. ` : "Ingen historik, tidtabellen gäller. ";
          row(fmt(o.atStop), `${chip(l.line)} ${esc(stopName(l.from))}`, `${usual}Du står där ${fmt(o.atStop)} och väntar oftast ${dur(o.wait)}.`, "s-bus", "", lc);
        } else {
          row(fmt(l.dep), `${chip(l.line)} Byt vid ${esc(stopName(l.from))}`, `Avgår ${fmt(l.dep)}${o.tr[k - 1] ? `, gå ${o.tr[k - 1]} m dit` : ""}.`, "s-bus", "", lc);
        }
      });
    }
    const L = o.walkOnly ? null : o.legs[o.legs.length - 1];
    const off = L ? `Kliv av vid ${esc(stopName(L.to))}, ${o.wd} m kvar. ` : "";
    row(fmt(o.final), `Framme`, `${off}Räknat på en ${S.settings.safety === "vanlig" ? "vanlig" : "sen"} morgon. Mål ${fmt(s.target)}, ${durMin(s.target - o.final)} tillgodo.`, "s-event", "", "", "senast");
    row(fmt(s.ev.start), esc(s.ev.title), `${esc(placeName(s.ev.place))} · till ${fmt(s.ev.end)}`, "s-event", "n-event");
  });
  return `<ol class="lm">${rows.join("")}</ol>`;
}

function chart(o) {
  const L = o?.legs?.[0];
  if (!L || !L.hist) return "";
  const dep = L.dep, h = L.hist;
  const W = 400, H = 120, pl = 12, pr = 12;
  const lo = dep - 150, hi = dep + 960;
  const x = s => pl + (s - lo) / (hi - lo) * (W - pl - pr);
  let g = "";
  for (let m = Math.ceil(lo / 120) * 2; m * 60 <= hi; m += 2) {
    g += `<line class="grid" x1="${x(m * 60)}" x2="${x(m * 60)}" y1="22" y2="88"/><text x="${x(m * 60)}" y="106" text-anchor="middle">${fmt(m * 60)}</text>`;
  }
  g += `<line class="tt" x1="${x(dep)}" x2="${x(dep)}" y1="12" y2="92" stroke-width="1.5"/><text x="${x(dep) + 4}" y="14">tidtabell</text>`;
  g += `<line class="you" x1="${x(o.atStop)}" x2="${x(o.atStop)}" y1="22" y2="88" stroke-width="2.5"/>`;
  const stack = {};
  for (const [day, d] of h.rows) {
    const k = Math.round(d / 20);
    stack[k] = (stack[k] || 0) + 1;
    const mon = dateOf(day).getDay() === 1;
    g += `<circle class="pt${mon ? " mon" : ""}" cx="${x(dep + d)}" cy="${80 - (stack[k] - 1) * 11}" r="4.5"><title>${day}: ${fmt(dep + d, true)}</title></circle>`;
  }
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="När ${L.line} ${fmt(dep)} faktiskt gick, 19 morgnar">${g}</svg></div>
  <div class="legend"><span style="--c: var(--ink)">Avgång</span><span style="--c: var(--bad)">Måndag</span><span style="--c: var(--amber)">Du vid hållplatsen ${fmt(o.atStop)}</span></div>
  <p class="note">Tidigast ${fmt(dep + h.min, true)}, oftast ${fmt(dep + h.median, true)}, 9 av 10 senast ${fmt(dep + h.q(0.9), true)}. Båda stora avvikelserna (+7 och +15 min) var måndagar, men 2 av 4 måndagar räcker inte för en slutsats.</p>`;
}

    ${ticks(o.stats)}<p class="note">${riskLine(o)} Säkerhetsnivå: <button class="link" type="button" data-act="settings">${SAFETY[S.settings.safety].name}</button>.</p></div>`;
  if (L?.hist) h += `<div class="block"><h2>Så brukar ${esc(L.line)} ${fmt(L.dep)} gå</h2>${chart(o)}</div>`;
  h += `<div class="block"><h2>Andra sätt att åka</h2><div class="opts">${s0.res.options.map((a, i) => optRow(a, { rec: i === 0, sel: a.key === o.key, wakeFrom: p.routine })).join("")}${s0.res.tooLate ? tooLateRow(s0.res.tooLate, p.routine) : ""}</div></div>`;
  h += `<div class="block"><h2>Testa</h2>
    <div class="seg" role="group" aria-label="Simulerad störning">

}
function cancelSet(date) {

}
function cancelledLabel(date) {

}
function disturbText(o) {

  if (ui.disturb === "cancel") return "Inställda turer syns i förväg, så appen väcker dig tidigare och väljer en annan buss.";

function armStatus(date, p) {

// ---------- Morning playback ----------
function startSim() {
  const date = ui.viewDate;
  const exclude = ui.disturb === "cancel" ? cancelSet(date) : null;
  const p = dayPlan(date, exclude);
  const o = p.segs[0].chosen;
  const L = o.walkOnly ? null : o.legs[0];
  const busDelay = L ? (L.hist ? L.hist.median : 0) + (ui.disturb === "late" ? 480 : 0) : 0;
  ui.sim = {
    date, p, o, L, startReal: Date.now(), startSim: p.wake - 90, speed: 60, paused: false, offset: 0,
    wake: p.wake, snoozes: 0, rang: false, log: [], said: new Set(), busDelay, live: null, done: false,
  };
  ui.sim.log.push(`${fmt(p.wake - 90)} Uppspelning startar, 1 sekund = 1 minut.`);
  render();
}
function simNow() {
  const s = ui.sim;
  if (!s) return 0;
  return s.startSim + s.offset + (s.paused ? 0 : (Date.now() - s.startReal) / 1000 * s.speed);
}
function pauseSim(on) {
  const s = ui.sim;
  if (!s || s.paused === on) return;
  if (on) { s.offset += (Date.now() - s.startReal) / 1000 * s.speed; s.paused = true; }
  else { s.startReal = Date.now(); s.paused = false; }
}
function simStep() {
  const s = ui.sim;
  if (!s || s.done) return;
  const t = simNow();
  const say = (k, msg) => { if (!s.said.has(k)) { s.said.add(k); s.log.unshift(`${fmt(t)} ${msg}`); } };
  if (!s.rang && t >= s.wake) {
    s.rang = true; pauseSim(true);
    showAlarm({ sim: true });
  }
  const o = s.o, L = s.L;
  if (L) {
    const realDep = L.dep + s.busDelay;
    const extra = Math.max(0, s.busDelay - (L.hist ? L.hist.median : 0));
    const known = t >= L.dep - 20 * 60;
    const leave = known && extra > 60 ? o.leave + extra - 60 : o.leave;
    s.live = known && extra > 60 ? { leave } : null;
    if (known && extra > 60) say("late", `Bussen är ${durMin(extra)} sen. Gå ${fmt(leave)} i stället för ${fmt(o.leave)}.`);
    if (t >= leave - 300) say("go5", "Gå hemifrån om 5 min.");
    if (t >= leave) say("go", "Gå nu.");
    if (t >= realDep) say("bus", `${L.line} gick ${fmt(realDep, true)}.`);
    if (t >= o.legs[o.legs.length - 1].arr + s.busDelay + walkS(o.wd)) { say("fram", "Framme."); s.done = true; pauseSim(true); }
  } else {
    if (t >= o.leave - 300) say("go5", "Gå om 5 min.");
    if (t >= o.leave) say("go", "Gå nu.");
    if (t >= o.final) { say("fram", "Framme."); s.done = true; pauseSim(true); }
  }
}
function morningPanel() {
  const s = ui.sim, t = simNow(), o = s.o, L = s.L;
  let sayText = "Sover";
  const leave = s.live?.leave ?? o.leave;
  if (t >= s.wake) sayText = t < leave - 300 ? `Gå om ${durMin(leave - t)}` : t < leave ? `Gå om ${dur(leave - t)}` : "Gå nu";
  if (L && t >= leave) sayText = t < L.dep + s.busDelay ? "Mot hållplatsen" : `På ${L.line}`;
  if (s.done) sayText = "Framme";
  let track = "";
  if (L) {
    const dep = L.dep + s.busDelay, per = 120, n = 6;
    const away = (dep - t) / per;
    const pos = Math.max(0, Math.min(1, 1 - away / n));
    const awayTxt = away > n ? `Bussen har inte börjat sin tur än` : away > 0 ? `Bussen är ${Math.ceil(away)} hållplats${Math.ceil(away) === 1 ? "" : "er"} bort · beräknas ${fmt(dep, true)}` : `Bussen har gått`;
    track = `<div class="tracker c-${esc(L.line)}"><div class="spread"><span class="label">${chip(L.line)} ${fmt(L.dep)} mot ${esc(stopName(L.from))}</span></div>
      <div class="track">${Array.from({ length: n + 1 }, (_, i) => `<i class="${i === n ? "here" : ""}" style="left:${(i / n) * 100}%"></i>`).join("")}<b style="left:${pos * 100}%"></b></div>
      <p class="note">${awayTxt}. Sista hållplatsen är din.</p></div>`;
  }
  return `<div class="morning" aria-live="polite">
    <div class="spread"><span class="label">Uppspelning</span><span class="simclock">${fmt(t, true)}</span></div>
    <div class="say">${sayText}</div>${track}
    <ul class="log">${s.log.slice(0, 5).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="row"><button class="btn small" type="button" data-act="simspeed">${s.speed === 60 ? "Snabbare" : "Normal fart"}</button><button class="btn small ghost" type="button" data-act="sim">Avsluta</button></div>
  </div>`;
}

// ---------- Alarm screen and sound ----------
let audioCtx = null, soundTimer = null, wakeLock = null;
function beep(vol) {
  const t = audioCtx.currentTime;
  [[0, 784], [0.18, 988]].forEach(([o, f]) => {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + o);
    g.gain.exponentialRampToValueAtTime(vol, t + o + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.15);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t + o); osc.stop(t + o + 0.17);
  });
}
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume?.(); } catch { audioCtx = null; }
}
function startSound() {
  stopSound();
  if (!audioCtx) return;
  let n = 0;
  const play = () => { try { beep(Math.min(0.4, 0.02 + n * 0.015)); } catch {} n++; };
  play();
  soundTimer = setInterval(play, 1100);
  try { navigator.vibrate?.([500, 300, 500, 300, 500]); } catch {}
}
function stopSound() { clearInterval(soundTimer); soundTimer = null; try { navigator.vibrate?.(0); } catch {} }
function snoozeInfo(ctx) {
  const ev = ctx.p.segs[0].ev;
  const slack = ev.routine === "vanlig" ? routineSec("vanlig") - routineSec("snabb") : 0;
  const len = Math.max(1, Number(S.settings.snooze) || 5) * 60;
  const used = ctx.snoozes * len;
  const left = Math.floor((slack - used) / len);
  return { len, left: Math.max(0, left), routineLeft: ctx.p.routine - used };
}
function showAlarm({ sim }) {
  const ctx = sim ? ui.sim : ui.armed;
  ui.alarm = { sim };
  const o = ctx.p.segs[0].chosen, ev = ctx.p.segs[0].ev;
  const sn = snoozeInfo(ctx);
  const nowT = sim ? simNow() : nowSec();
  const leg = o && !o.walkOnly ? `${o.legs[0].line} ${fmt(o.legs[0].dep)}` : "Gå";
  $("alarmInner").innerHTML = `<div class="now">${fmt(nowT)}</div>
    <p class="what"><span>${esc(leg)}</span> · ${esc(ev.title)} ${fmt(ev.start)}</p>
    <p class="hint">Gå hemifrån ${fmt(o.leave)}. Rutinen har ${durMin(sn.routineLeft)} kvar.</p>
    <div class="btns">
      <button class="btn primary" type="button" data-act="alarmoff">Stäng av</button>
      <button class="btn" type="button" data-act="snooze" ${sn.left ? "" : "disabled"}>${sn.left ? `Snooza ${durMin(sn.len)}` : "Ingen marginal kvar"}</button>
    </div>
    <p class="hint">${sn.left ? `${sn.left} snooze kvar. Varje snooze kortar rutinen, bussen är densamma.` : ev.routine === "snabb" ? "Du har redan snabb rutin, så det finns ingen tid att snooza på." : "Rutinen är nere på snabb rutin. Snooza mer och du missar bussen."}</p>`;
  $("alarm").hidden = false;
  startSound();
  $("alarmInner").querySelector("button")?.focus();
}
function closeAlarm(snooze) {
  stopSound();
  $("alarm").hidden = true;
  const a = ui.alarm; ui.alarm = null;
  if (!a) return;
  const ctx = a.sim ? ui.sim : ui.armed;
  if (!ctx) return;
  if (snooze) {
    const sn = snoozeInfo(ctx);
    ctx.snoozes++;
    if (a.sim) { ctx.wake += sn.len; ctx.rang = false; ctx.log.unshift(`${fmt(simNow())} Snooze ${durMin(sn.len)}.`); }
    else { ctx.at += sn.len * 1000; ctx.wake += sn.len; ctx.rang = false; }
  } else if (a.sim) {
    ctx.log.unshift(`${fmt(simNow())} Larmet avstängt. God morgon.`);
  } else {
    ui.armed = null;
    releaseWakeLock();
  }
  if (a.sim) pauseSim(false);
  render();
}
async function arm(date) {
  if (ui.armed && ui.armed.date === date) { ui.armed = null; releaseWakeLock(); render(); return; }
  unlockAudio();
  const p = dayPlan(date, ui.disturb === "cancel" ? cancelSet(date) : null);
  if (p.wake == null) return;
  const at = dateOf(date); at.setHours(0, 0, 0, 0);
  const ms = at.getTime() + p.wake * 1000;

// Deterministic street grid so the example map looks the same every time.
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mapBounds(area) {
  const pts = [...Object.values(STOPS), { x: S.home.x, y: S.home.y }, ...S.places].filter(p => areaOf(p) === area);
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
  const size = Math.max(1400, x1 - x0 + 600, y1 - y0 + 600);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return { x0: cx - size / 2, y0: cy - size / 2, size };
}
function mapSvg(area, { editing = false, from = null, stop = null } = {}) {
  const b = mapBounds(area), k = b.size / 360;
  const X = x => (x - b.x0).toFixed(1), Y = y => (b.y0 + b.size - y).toFixed(1);
  const r = rng(area === "hem" ? 7 : 19);
  let streets = "";
  for (let v = b.x0 + 60; v < b.x0 + b.size; v += 140 + r() * 120) { const s = (r() - .5) * 120; streets += `M${X(v)} ${Y(b.y0)}L${X(v + s)} ${Y(b.y0 + b.size)}`; }
  for (let v = b.y0 + 60; v < b.y0 + b.size; v += 140 + r() * 120) { const s = (r() - .5) * 120; streets += `M${X(b.x0)} ${Y(v)}L${X(b.x0 + b.size)} ${Y(v + s)}`; }
  let g = `<rect class="park" x="${X(b.x0 + b.size * .62)}" y="${Y(b.y0 + b.size * .3)}" width="${(b.size * .22).toFixed(0)}" height="${(b.size * .16).toFixed(0)}" rx="${(8 * k).toFixed(0)}"/>`;
  g += `<path class="street" d="${streets}" stroke-width="${(5 * k).toFixed(1)}"/>`;
  const drawn = new Set();
  for (const t of TRIPS) {
    const key = t.line + t.dir;
    if (drawn.has(key) || drawn.has(t.line + "rev")) continue;
    drawn.add(key); drawn.add(t.line + "rev");
    const pts = t.stops.map(s => STOPS[s]);
    if (!pts.some(p => areaOf(p) === area)) continue;
    g += `<polyline class="route" points="${pts.map(p => `${X(p.x)},${Y(p.y)}`).join(" ")}" stroke="var(--l${t.line.toLowerCase()})" stroke-width="${(4 * k).toFixed(1)}" opacity=".9"/>`;
  }
  const homeArea = areaOf(S.home) === area;
  const showHome = homeArea && S.home.mode === "point";
  // Walking lines: from the chosen start to its stop, or from home to every stop nearby.
  const walkLines = [];
  if (from) { const p = place(from); if (p && stop) walkLines.push([p, STOPS[stop], true]); }
  else {
    if (showHome) for (const n of nearStops(S.home)) walkLines.push([S.home, STOPS[n.stop], false]);
    for (const p of S.places) if (areaOf(p) === area) { const n = nearStops(p)[0]; if (n) walkLines.push([p, STOPS[n.stop], false]); }
  }
  for (const [a, s, hl] of walkLines) {
    const m = walkM(a, s);
    g += `<line class="walk${hl ? " hl" : ""}" x1="${X(a.x)}" y1="${Y(a.y)}" x2="${X(s.x)}" y2="${Y(s.y)}" stroke-width="${(2.2 * k).toFixed(1)}" stroke-dasharray="${(2 * k).toFixed(1)} ${(5 * k).toFixed(1)}"/>`;
    if (hl) g += `<text class="sub" x="${X((a.x + s.x) / 2)}" y="${Y((a.y + s.y) / 2)}" font-size="${(10.5 * k).toFixed(1)}" stroke-width="${(3 * k).toFixed(1)}" text-anchor="middle">${m} m</text>`;
  }
  for (const [id, s] of Object.entries(STOPS)) {
    if (areaOf(s) !== area) continue;
    g += `<circle class="stop${id === stop ? " hl" : ""}" cx="${X(s.x)}" cy="${Y(s.y)}" r="${(6 * k).toFixed(1)}" stroke-width="${(2.5 * k).toFixed(1)}"/>`;
    g += `<text class="lbl" x="${X(s.x + 10 * k)}" y="${Y(s.y - 18 * k)}" font-size="${(12 * k).toFixed(1)}" stroke-width="${(3.5 * k).toFixed(1)}">${esc(s.name)}</text>`;
  }
  for (const p of S.places) {
    if (areaOf(p) !== area) continue;
    const s = 9 * k;
    g += `<rect class="place" x="${(+X(p.x) - s / 2).toFixed(1)}" y="${(+Y(p.y) - s / 2).toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" rx="${(1.5 * k).toFixed(1)}"/>`;
    g += `<text class="lbl" x="${X(p.x + 9 * k)}" y="${Y(p.y + 6 * k)}" font-size="${(12 * k).toFixed(1)}" stroke-width="${(3.5 * k).toFixed(1)}">${esc(p.name)}</text>`;
  }
  if (showHome) {
    const hx = +X(S.home.x), hy = +Y(S.home.y), s = 8 * k;
    g += `<path class="home" d="M${hx - s} ${hy + s}V${hy - s * .1}L${hx} ${hy - s}L${hx + s} ${hy - s * .1}V${hy + s}Z"/>`;
    g += `<text class="lbl" x="${(hx + s + 4 * k).toFixed(1)}" y="${(hy + 4 * k).toFixed(1)}" font-size="${(12 * k).toFixed(1)}" stroke-width="${(3.5 * k).toFixed(1)}">Hem</text>`;
  }
  const sb = 200, sx = b.size - 20 * k - sb, sy = b.size - 16 * k;
  g += `<path class="scale" d="M${sx} ${sy - 5 * k}V${sy}H${sx + sb}V${sy - 5 * k}" fill="none" stroke-width="${(1.5 * k).toFixed(1)}"/><text class="sub" x="${sx + sb / 2}" y="${sy - 8 * k}" font-size="${(10 * k).toFixed(1)}" stroke-width="${(3 * k).toFixed(1)}" text-anchor="middle">200 m</text>`;
  return `<svg class="map${editing ? " editing" : ""}" data-area="${area}" viewBox="0 0 ${b.size.toFixed(0)} ${b.size.toFixed(0)}" role="img" aria-label="Exempelkarta över ${area === "hem" ? "området hemma" : "stan"}">${g}</svg>`;
}
function mapClick(ev) {
  const svg = ev.target.closest("svg.map");
  if (!svg || !ui.mapEdit) return;
  const area = svg.dataset.area, b = mapBounds(area);
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const m = svg.getScreenCTM();
  if (!m) return;
  const q = pt.matrixTransform(m.inverse());
  const x = Math.round(b.x0 + q.x), y = Math.round(b.y0 + b.size - q.y);
  const e = ui.mapEdit;
  if (e.kind === "home") Object.assign(S.home, { x, y, mode: "point" });
  else if (e.kind === "move") Object.assign(S.places.find(p => p.id === e.id) || {}, { x, y });
  else if (e.kind === "new") S.places.push({ id: "p" + Date.now().toString(36), name: e.name, x, y, note: "" });
  ui.mapEdit = null;
  saveState(); render();
}

      <label class="field" for="set-snooze">Längd (min)<input id="set-snooze" type="number" min="1" max="15" value="${esc(st.snooze)}"></label>
      <p class="note">Snooze tar tid från rutinen, aldrig från bussen.</p></div>
    <div class="steps"><span class="label">Utseende</span>
      <div class="seg" role="group" aria-label="Tema">${[["dark", "Mörkt"], ["light", "Ljust"], ["system", "Som telefonen"]].map(([k, n]) => `<button type="button" data-act="theme" data-k="${k}" aria-pressed="${st.theme === k}">${n}</button>`).join("")}</div></div>
    <div><button class="link" type="button" data-act="about">Om exempeldata och hur appen räknar</button></div>
    <div class="steps"><span class="label">Data</span><p class="note">Allt sparas bara i den här webbläsaren.</p>
      ${ui.confirmReset ? `<div class="row"><button class="btn danger" type="button" data-act="resetok">Ja, återställ allt</button><button class="btn ghost" type="button" data-act="resetno">Avbryt</button></div>` : `<div><button class="btn small ghost" type="button" data-act="reset">Återställ exempeldata</button></div>`}</div>`);
}

function openAbout() {
  const st = S.settings;
  openSheet(`<div class="sheet-head"><h2>Exempeldata</h2><button class="btn small ghost" type="button" data-act="close">Stäng</button></div>
    <div class="steps prose">
      <p>Det här är fas A, en klickbar prototyp.</p>
      <p><b>Riktigt:</b> 670X:s vardagsavgångar 06:20–07:50 från Pålsundsvägen och 19 morgnar för 07:21 (KoDa, 29 sep–23 okt 2026).</p>
      <p><b>Exempel:</b> övriga linjer, hållplatserna i stan, platserna, restiderna och kartan. Du kan inte söka riktiga adresser än. Det kommer i fas B.</p>
    </div>
    <div class="steps prose"><span class="label">Så räknar appen</span>
      <p>Appen utgår från när du ska vara framme och räknar baklänges. Den letar resor med högst ett byte och väljer den där du kan gå hemifrån senast, men bara om den hinner fram även en ${st.safety === "vanlig" ? "vanlig" : "sen"} morgon.</p>
      <p><b>Vid hållplatsen:</b> den tidigaste avgång som setts minus 30 s, avrundat nedåt till hel minut. Utan historik: 1 min före tidtabellen.</p>
      <p><b>Ankomst:</b> med historik används förseningen för vald säkerhetsnivå. Utan historik antas regionbussar vara ${durMin(UNKNOWN_LATE.regional[st.safety])} sena och stadsbussar ${durMin(UNKNOWN_LATE.city[st.safety])}. Vid byte krävs minst 1 min mellan avstigning och nästa buss.</p>
      <p><b>Gång:</b> fågelvägen × 1,25 i vald hastighet.</p>
      <p><b>Restiden</b> med 670X är påhittad tills riktiga ankomsttider finns.</p></div>`);
}

// ---------- Sheet ----------
function openSheet(html) { $("sheetPanel").innerHTML = html; $("sheet").hidden = false; ui.sheet = true; $("sheetPanel").querySelector("input,select,button")?.focus(); }
function closeSheet() { $("sheet").hidden = true; ui.sheet = null; ui.confirmReset = false; }

// ---------- Render ----------
function applyTheme() { document.documentElement.dataset.appTheme = S.settings.theme; }
function render() {
  applyTheme();
  for (const t of ["idag", "vecka", "resa", "platser"]) {
    $("view-" + t).hidden = ui.tab !== t;
    document.querySelector(`.tab[data-tab="${t}"]`).setAttribute("aria-current", ui.tab === t ? "page" : "false");
  }
  const v = $("view-" + ui.tab);
  if (ui.tab === "idag") v.innerHTML = viewIdag();
  if (ui.tab === "vecka") v.innerHTML = viewVecka();
  if (ui.tab === "resa") { v.innerHTML = viewResa(); renderResaResults(); }
  if (ui.tab === "platser") v.innerHTML = viewPlatser();
}
function tick() {
  $("clock").textContent = fmt(nowSec());
  if (ui.armed && !ui.alarm && Date.now() >= ui.armed.at) showAlarm({ sim: false });
  if (ui.sim) {
    simStep();
    if (ui.tab === "idag" && !ui.alarm) {
      const panel = document.querySelector(".morning");
      if (panel) { const tmp = document.createElement("div"); tmp.innerHTML = morningPanel(); panel.replaceWith(tmp.firstElementChild); }
      if (ui.sim.live && !ui.sim.liveShown) { ui.sim.liveShown = true; render(); }
    }
  } else if (ui.tab === "idag" && ui.armed) {
    const el = $("armStatus");
    if (el) el.textContent = armStatus(ui.viewDate, null);
  }
}

// ---------- Events ----------
document.addEventListener("click", ev => {
  const tab = ev.target.closest(".tab");
  if (tab) { ui.tab = tab.dataset.tab; ui.mapEdit = null; render(); window.scrollTo(0, 0); return; }
  if (ev.target.closest("svg.map.editing")) { mapClick(ev); return; }
  if (ev.target === $("sheet")) { closeSheet(); return; }
  const opt = ev.target.closest("button.opt");
  if (opt) {
    const key = opt.dataset.opt;
    if (ui.tab === "idag") {
      const p = dayPlan(ui.viewDate);
      const e = p.segs[0]?.ev;
      if (e) { e.choice = key; saveState(); render(); }
    } else if (ui.tab === "resa") { ui.resa.open = ui.resa.open === key ? null : key; renderResaResults(); }
    return;
  }
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  switch (a) {
    case "day": {
      const i = Math.round((dateOf(ui.viewDate) - dateOf(todayIso())) / 864e5) + Number(d.d);
      ui.viewDate = addDays(todayIso(), Math.max(0, Math.min(6, i)));
      if (ui.sim) ui.sim = null;
      ui.disturb = "none"; render(); break;
    }
    case "arm": arm(ui.viewDate); break;
    case "sim": if (ui.sim) { ui.sim = null; render(); } else { unlockAudio(); startSim(); } break;
    case "simspeed": { const s = ui.sim; pauseSim(true); s.speed = s.speed === 60 ? 240 : 60; pauseSim(false); break; }
    case "disturb": ui.disturb = d.k; ui.sim = null; render(); break;
    case "alarmoff": closeAlarm(false); break;
    case "snooze": closeAlarm(true); break;
    case "settings": openSettings(); break;
    case "about": openAbout(); break;
    case "details": ui.details = !ui.details; render(); break;
    case "toggleday": ui.openDay = ui.openDay === d.date ? null : d.date; render(); break;
    case "lmtoggle": { const li = b.closest("li"); const on = !li.classList.contains("open"); li.classList.toggle("open", on); b.setAttribute("aria-expanded", on); break; }
    case "close": closeSheet(); render(); break;
    case "newev": openEventEditor(null, d.date); break;
    case "editev": openEventEditor(d.id); break;
    case "delev": S.events = S.events.filter(e => e.id !== d.id); saveState(); closeSheet(); render(); break;
    case "openday": ui.viewDate = d.date; ui.tab = "idag"; ui.disturb = "none"; ui.sim = null; render(); window.scrollTo(0, 0); break;
    case "clearex": S.events = S.events.filter(e => !e.example); saveState(); render(); break;
    case "safety": S.settings.safety = d.k; saveState(); render(); if (ui.sheet) openSettings(); break;
    case "speed": S.settings.speed = d.k; saveState(); openSettings(); render(); break;
    case "theme": S.settings.theme = d.k; saveState(); applyTheme(); openSettings(); break;
    case "rtadd": S.settings.routines[d.rt].push(["Nytt moment", 5]); saveState(); openSettings(); break;
    case "rtdel": S.settings.routines[d.rt].splice(Number(d.i), 1); saveState(); openSettings(); break;
    case "reset": ui.confirmReset = true; openSettings(); break;
    case "resetno": ui.confirmReset = false; openSettings(); break;
    case "resetok": S = seed(); saveState(); ui.confirmReset = false; ui.viewDate = null; ui.armed = null; ui.sim = null; closeSheet(); render(); break;
    case "area": ui.mapArea = d.k; ui.mapEdit = null; render(); break;
    case "movepl": ui.mapEdit = d.id === "hem" ? { kind: "home" } : { kind: "move", id: d.id }; ui.mapArea = areaOf(place(d.id)); render(); break;
    case "cancelmap": ui.mapEdit = null; render(); break;
    case "newpl": {
      const name = $("newPlaceName").value.trim();
      if (!name) { $("newPlaceName").focus(); $("newPlaceName").placeholder = "Skriv ett namn först"; break; }
      ui.mapEdit = { kind: "new", name }; render(); break;
    }
    case "delpl": ui.confirmDel = d.id; render(); break;
    case "delplno": ui.confirmDel = null; render(); break;
    case "delplok": {
      const id = ui.confirmDel;
      S.events.forEach(e => { if (e.place === id) { e.place = "hem"; e.choice = undefined; } });
      S.places = S.places.filter(p => p.id !== id);
      ui.confirmDel = null; saveState(); render(); break;
    }
    case "homemode": S.home.mode = d.k; saveState(); render(); break;
    case "addtrip": {
      const r = ui.resa;
      S.events.push({ id: "e" + Date.now().toString(36), title: `Resa till ${placeName(r.to)}`, place: r.to, date: r.date, start: pc(r.time), end: pc(r.time) + 1800, early: 0, routine: "vanlig", repeat: false, choice: d.key });
      saveState(); b.textContent = "Tillagd i veckan"; b.disabled = true; break;
    }
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id?.startsWith("r-")) {
    const r = ui.resa;
    if (t.id === "r-from") r.from = t.value;
    if (t.id === "r-to") r.to = t.value;
    if (t.id === "r-date") r.date = t.value;
    if (t.id === "r-time") r.time = t.value;
    r.open = null; renderResaResults(); return;
  }
  if (t.id === "home-stop") { S.home.stop = t.value; saveState(); render(); return; }
  if (t.id === "home-m") { S.home.meters = Math.max(0, Math.min(3000, Math.round(Number(t.value) || 0))); saveState(); render(); return; }
  if (t.id === "set-kmh") { S.settings.customKmh = Math.max(2, Math.min(15, Number(t.value) || 5)); saveState(); openSettings(); render(); return; }
  if (t.id === "set-snooze") { S.settings.snooze = Math.max(1, Math.min(15, Math.round(Number(t.value) || 5))); saveState(); return; }
  if (t.dataset.rt) {
    const row = S.settings.routines[t.dataset.rt][Number(t.dataset.i)];
    if (t.dataset.f === "n") row[0] = t.value.trim() || "Moment";
    else row[1] = Math.max(0, Math.min(120, Math.round(Number(t.value) || 0)));
    saveState();
    const sum = $("rtsum-" + t.dataset.rt);
    if (sum) sum.textContent = durMin(routineSec(t.dataset.rt));
    render();
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && ui.sheet) { closeSheet(); render(); }
});
$("openSettings").addEventListener("click", openSettings);
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && ui.armed && !wakeLock) { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
});

render();
tick();
setInterval(tick, 1000);
</script>
